name: CI

# Fast test gate. Runs on every push to main and on PRs so a broken change is
# caught BEFORE it can be tagged for release. Linux-only (cheapest runner = 1x
# minutes). The release workflow trusts this gate and skips re-running tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels an in-flight run — saves minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend tests
        working-directory: backend
        run: mvn -B -ntp test

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            proxy/package-lock.json

      - name: Proxy install + tests
        working-directory: proxy
        run: |
          npm ci
          npm test

      # Use `npm install`, not `npm ci`: electron-builder pulls per-OS OPTIONAL
      # dependencies (e.g. electron-builder-squirrel-windows on Windows, dmg
      # tooling on macOS) that a single committed lockfile generated on one OS
      # can't contain — so `npm ci` (strict) fails on a different runner OS with
      # "Missing … from lock file". `npm install` reconciles those per platform.
      # Compile-check only → skip the ~100 MB Electron binary download too.
      - name: UI install
        working-directory: ui
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: UI build (compile check)
        working-directory: ui
        run: npm run build
