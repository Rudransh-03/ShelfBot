# ============================================================
# Local File Brain — Configuration
# ============================================================

# REQUIRED: The root folder containing your documents.
files.root.path=/Users/rudransh03/Desktop/test-folder

# Path to the SQLite metadata database (created automatically).
metadata.db.path=shelfbot-metadata.db

# ============================================================
# Chunking
# ============================================================
chunk.size.chars=1800
chunk.overlap.chars=200
supported.extensions=pdf,docx,doc,txt,md,xlsx,xls,pptx,ppt,odt,ods,odp,html,htm,rtf,csv
max.file.size.bytes=52428800

# ============================================================
# Stage 2: Embedding (OpenAI)
# ============================================================

# REQUIRED for Stage 2: your OpenAI API key
openai.api.key=${OPENAI_API_KEY}

# Number of chunks per OpenAI API call. 100 is safe and efficient.
embedding.batch.size=100

# ============================================================
# Stage 2: ChromaDB
# ============================================================

# URL where ChromaDB is running locally.
# Start ChromaDB with: pip install chromadb && chroma run --path ./chroma-data
chromadb.url=http://[::1]:8000

# Name of the collection to store all chunks in.
chromadb.collection=local-file-brain

ollama.url=http://localhost:11434
ollama.embedding.model=nomic-embed-text
ollama.chat.model=phi3:mini
