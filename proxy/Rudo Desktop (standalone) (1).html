document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:[...s.obFolders, '~/Desktop/Work'] }));\n  removeObFolder = (e) => { const i = +e.currentTarget.getAttribute('data-idx'); this.setState(s => ({ obFolders: s.obFolders.filter((_,x)=>x!==i) })); };\n\n  navTo = (v) => this.setState({ view:v });\n  toggleCollapse = () => this.setState(s => ({ collapsed: !s.collapsed }));\n  openSearch = () => this.setState({ searchOpen:true });\n  closeSearch = () => this.setState({ searchOpen:false });\n  onSearchInput = (e) => this.setState({ searchQuery: e.target.value });\n  newChat = () => this.setState({ messages:[], input:'' });\n  reindex = () => { this.toast('Re-indexing started'); };\n  noop = () => {};\n  stop = (e) => e.stopPropagation();\n\n  onInput = (e) => this.setState({ input: e.target.value });\n  onKey = (e) => { if (e.key === 'Enter') this.send(); };\n\n  pickAnswer(q) {\n    const t = q.toLowerCase();\n    if (t.includes('lease')) return this.ANSWERS.lease;\n    if (t.includes('tax')) return this.ANSWERS.tax;\n    if (t.includes('insurance') || t.includes('policy')) return this.ANSWERS.insurance;\n    return this.ANSWERS.generic;\n  }\n\n  ask = (q) => { this.setState({ input:q }, () => this.send()); };\n\n  send = () => {\n    const q = (this.state.input || '').trim();\n    if (!q || this._streaming) return;\n    const ans = this.pickAnswer(q);\n    const uid = 'u'+Date.now(); const rid = 'r'+Date.now();\n    const full = ans.pre + ans.hi + ans.post;\n    const firstThread = this.state.threads.length === 0;\n    this.setState(s => ({\n      input:'',\n      threads: firstThread ? [{ id:rid, title: q.length>34 ? q.slice(0,34)+'…' : q }] : s.threads,\n      messages: [...s.messages,\n        { id:uid, role:'user', text:q },\n        { id:rid, role:'rudo', streaming:true, text:'', mood:'thinking', ans }\n      ]\n    }));\n    this._streaming = true;\n    let i = 0;\n    const step = () => {\n      i += Math.max(2, Math.round(full.length/38));\n      const shown = full.slice(0, i);\n      this.setState(s => ({ messages: s.messages.map(m => m.id===rid ? { ...m, text: shown } : m) }));\n      if (i < full.length) { this._st = setTimeout(step, 45); }\n      else {\n        this._streaming = false;\n        this.setState(s => ({ messages: s.messages.map(m => m.id===rid ? {\n          ...m, streaming:false, done:true, mood:'happy',\n          pre:ans.pre, hi:ans.hi, post:ans.post, sources:ans.sources, actions:ans.actions, table:ans.table\n        } : m) }));\n      }\n    };\n    this._st = setTimeout(step, 620);\n  };\n\n  copyMsg = () => this.toast('Copied to clipboard', 'check');\n  emailMsg = () => this.toast('Draft email opened', 'check');\n  excelMsg = () => this.toast('Exported Invoices.xlsx', 'check');\n\n  // ---- library\n  indexNow = () => {\n    if (this.state.libState==='indexing') return;\n    this.setState({ libState:'indexing', libProgress:0 });\n    const tick = () => {\n      this.setState(s => {\n        const p = Math.min(100, s.libProgress + Math.random()*16 + 6);\n        return { libProgress:p };\n      });\n      if (this.state.libProgress < 100) this._li = setTimeout(tick, 340);\n      else { this.setState({ libState:'result' }); this.toast('Indexed 1,248 files'); }\n    };\n    this._li = setTimeout(tick, 340);\n  };\n  onFilter = (e) => this.setState({ fileFilter: e.target.value });\n  openSummary = (name) => this.setState({ summaryOpen:true, summaryFile:name });\n  closeSummary = () => this.setState({ summaryOpen:false });\n\n  // ---- deadlines\n  unlockPro = () => { this.setState({ pro:true }); this.toast('Deadlines unlocked'); };\n  findDeadlines = () => {\n    this.setState({ dlState:'scanning' });\n    setTimeout(() => { this.setState({ dlState:'list' }); this.toast('Found 6 deadlines'); }, 1500);\n  };\n  setDlTab = (t) => this.setState({ dlTab:t });\n  openReminder = (d) => this.setState({ reminderOpen:true, reminderFor:d });\n  closeReminder = () => this.setState({ reminderOpen:false });\n  confirmReminder = () => {\n    const d = this.state.rem n 30, 2026', bucket:'Overdue', file:'Addendum.pdf', unsure:true },\n      { id:'d1', kind:'Renewal', title:'Lease renewal', desc:'Lease renews automatically; 60 days written notice required to opt out.', due:'in 5 days', date:'Mar 1, 2027', bucket:'Due soon', file:'Lease_2024.pdf', recurring:'yearly' },\n      { id:'d2', kind:'Deadline', title:'Property tax — 2nd installment', desc:'Second installment payable to the county assessor.', due:'in 12 days', date:'Oct 12, 2026', bucket:'Due soon', file:'Tax_2024.pdf' },\n      { id:'d4', kind:'Renewal', title:'Auto policy renewal', desc:'Vehicle insurance policy renews annually.', due:'in 2 months', date:'Sep 1, 2026', bucket:'Upcoming', file:'Auto_Policy.pdf', recurring:'yearly' },\n    ].map(d => ({\n      ...d,\n      kindStyle: this.kindStyle(d.kind),\n      dueStyle: this.dueStyle(d.bucket),\n      reminded: !!reminded[d.id],\n      notReminded: !reminded[d.id],\n      hasRecurring: !!d.recurring,\n      hasUnsure: !!d.unsure,\n      fileIcon: this.el(this.ICONS.file),\n      setReminder: () => this.openReminder(d),\n    }));\n    const showSet = this.state.dlTab==='set';\n    const list = showSet ? raw.filter(d=>d.reminded) : raw.filter(d=>!d.reminded);\n    const order = ['Overdue','Due soon','Upcoming'];\n    return order.map(b => ({ bucket:b, cards: list.filter(d=>d.bucket===b) })).filter(g => g.cards.length);\n  }\n\n  navStyle(id) {\n    const active = this.state.view === id;\n    const base = { display:'flex', alignItems:'center', gap:'11px', padding: this.state.collapsed ? '10px 0' : '9px 11px', justifyContent: this.state.collapsed ? 'center' : 'flex-start', borderRadius:'10px', cursor:'pointer', marginBottom:'2px', color: active ? 'var(--ink)' : 'var(--soft)' };\n    if (active) base.background = 'rgba(179,167,152,0.22)';\n    return base;\n  }\n\n  renderVals() {\n    const s = this.state;\n    const collapsed = s.collapsed;\n    const nav = [\n      { id:'chat', label:'Chat' },\n      { id:'library', label
